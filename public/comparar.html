<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calto Tech | Comparar periféricos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="barra-topo" aria-label="Topo">
    <div class="barra-topo-dentro">
      <a class="assinatura" href="index.html"><span class="logo" aria-hidden="true"></span>Calto Tech</a>
      <div class="topo-links">
        <a class="voltar" href="index.html">Voltar para a lista</a>
        <a class="insta" href="https://www.instagram.com/duda.calto/" target="_blank" rel="noopener noreferrer" aria-label="Meu Instagram, @duda.calto">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
          <span>@duda.calto</span>
        </a>
      </div>
    </div>
  </nav>

  <header class="topo compacto">
    <div class="emblema" aria-hidden="true"></div>
    <h1>Comparando</h1>
  </header>

  <main>
    <section class="controles" aria-label="Opções da comparação">
      <label class="toggle">
        <input type="checkbox" id="so-diferencas">
        <span>Mostrar só as diferenças</span>
      </label>
      <p class="legenda">Marcado como "melhor": maior DPI, polling rate, bateria e FPS; menor peso (em mouses e headsets).</p>
    </section>

    <p id="status" class="status" role="status"></p>
    <div id="tabela-wrap" class="tabela-wrap"></div>
  </main>

  <footer class="rodape-site">Calto Tech</footer>

  <script src="comum.js"></script>
  <script src="comparar.js"></script>
</body>
</html>
