<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calto Tech | Meus periféricos, testados</title>
  <link rel="icon" type="image/svg+xml" href="asas.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="barra-topo" aria-label="Topo">
    <div class="barra-topo-dentro">
      <a class="assinatura" href="index.html"><span class="logo" aria-hidden="true"></span>Calto Tech</a>
      <div class="topo-links">
        <a class="insta" href="https://www.instagram.com/duda.calto/" target="_blank" rel="noopener noreferrer" aria-label="Meu Instagram, @duda.calto">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
          <span>@duda.calto</span>
        </a>
      </div>
    </div>
  </nav>

  <header class="topo">
    <div class="emblema" aria-hidden="true"></div>
    <h1>Minha experiência, <em>sua escolha.</em></h1>
    <p class="sub">Descubra os periféricos que fazem parte do meu setup, com especificações, avaliações pessoais e detalhes de cada produto.</p>
    <ul id="resumo" class="resumo" aria-label="Resumo"></ul>
  </header>

  <main>
    <!-- Fotos do setup: ficam em public/img/ -->
    <section class="setup" aria-labelledby="setup-titulo">
      <div class="setup-texto">
        <p class="marca">Meu setup</p>
        <h2 id="setup-titulo">Onde tudo é testado</h2>
      </div>
      <!-- Carrossel: para incluir uma foto, copie um <a class="foto setup-foto"> dentro da trilha -->
      <div class="carrossel" aria-roledescription="carrossel" aria-label="Fotos do meu setup">
        <div class="carrossel-trilha" tabindex="0">
          <a class="foto setup-foto" href="img/setup.jpeg" target="_blank" rel="noopener">
            <img src="img/setup.jpeg" alt="Meu setup branco: monitor ultrawide com moldura de arabescos, teclado Gravastar e mouse branco">
          </a>
          <a class="foto setup-foto" href="img/setup2.jpeg" target="_blank" rel="noopener">
            <img src="img/setup2.jpeg" alt="Meu setup visto de frente, com o monitor vertical ao lado do ultrawide">
          </a>
        </div>
        <button class="carrossel-seta anterior" type="button" aria-label="Foto anterior">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="carrossel-seta proxima" type="button" aria-label="Próxima foto">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="carrossel-pontos"></div>
      </div>
    </section>

    <section class="controles" aria-label="Filtros">
      <div id="filtros-categoria" class="chips" role="group" aria-label="Categoria"></div>
      <label class="toggle">
        <input type="checkbox" id="so-review">
        <span>Só os que eu avaliei</span>
      </label>
    </section>

    <p id="status" class="status" role="status"></p>
    <section id="lista" class="grade"></section>
  </main>

  <footer class="rodape-site">Calto Tech</footer>

  <div id="barra" class="barra" hidden>
    <span id="barra-texto"></span>
    <button type="button" id="limpar" class="chip">Limpar</button>
    <a id="barra-link" class="botao" href="comparar.html" hidden>Comparar</a>
  </div>

  <script src="comum.js"></script>
  <script src="app.js"></script>
</body>
</html>
