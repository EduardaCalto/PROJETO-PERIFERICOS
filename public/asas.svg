<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130">
  <!-- Asas de anjo brancas. A asa esquerda é desenhada uma vez e espelhada. -->
  <defs>
    <linearGradient id="pena" x1="1" y1="0.3" x2="0" y2="0.7">
      <stop offset="0" stop-color="#f3f0fa"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <g id="asa" stroke="#cfc6e2" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <!-- contorno: borda de cima lisa, borda de baixo com as pontas das penas -->
      <path fill="url(#pena)" d="M210 52C186 12 104 -4 1 5Q22 17 30 40Q30.9 57.1 48 58Q51.8 75.9 70 74Q75.7 91.8 94 88Q102.5 104.7 120 98Q131.3 113.6 148 104Q162.9 115.6 176 102Q193.4 106.8 200 90Q212 74 210 52Z"/>
      <!-- fileira de penas menores (coberteiras) -->
      <path fill="none" d="M70 28Q76.6 46.4 96 44Q104.4 62.2 124 58Q134.8 73.2 152 66Q165.2 78.2 180 68Q194.4 74.6 204 62"/>
      <!-- fileira próxima da borda de cima -->
      <path fill="none" opacity="0.8" d="M128 14Q131 26 146 26Q151 36 166 34Q172 43 186 40Q194 46 204 42"/>
      <!-- divisões entre as penas longas -->
      <path fill="none" opacity="0.75" d="M30 40L66 41M48 58L86 56M70 74L104 67M94 88L124 76M120 98L144 84M148 104L164 89M176 102L186 86"/>
    </g>
  </defs>
  <use href="#asa"/>
  <use href="#asa" transform="translate(440 0) scale(-1 1)"/>
